<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Tracker | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-container">
    <header>
        <h1>Exercise Tracker</h1>

    </header>

    <div class="grid">
        <section class="card">
            <h2>1. Create User</h2>
            <form action="/api/users" method="POST">
                <input type="text" name="username" placeholder="Username (e.g. Lewis)" required>
                <button type="submit">Create User</button>
            </form>
            <div class="helper-text">
                <p>After creating, copy the <code>id</code> from the JSON response.</p>
            </div>
        </section>

        <section class="card">
            <h2>2. Add Exercise</h2>
            <form id="exerciseForm">
                <input type="text" id="userId" placeholder="User ID (id)*" required>
                <input type="text" name="description" placeholder="Description*" required>
                <input type="number" name="duration" placeholder="Duration* (mins)" required>
                <input type="date" name="date" placeholder="Date (Optional)">
                <button type="button" onclick="handleExerciseSubmit()">Add Exercise</button>
            </form>
        </section>
    </div>

    <section class="card wide">
        <h2>3. View Activity Logs</h2>
        <div class="log-query">
            <input type="text" id="logId" placeholder="Paste User ID here...">
            <button onclick="viewLogs()">View Full Log</button>
        </div>
    </section>
</div>

<script>
    function handleExerciseSubmit() {
        const id = document.getElementById('userId').value;
        const form = document.getElementById('exerciseForm');

        if(!id) return alert("Please enter a User ID");

        const formData = new FormData(form);
        const params = new URLSearchParams(formData);

        // Dynamically send to the correct user endpoint
        fetch(`/api/users/${id}/exercises`, {
            method: 'POST',
            body: params
        }).then(res => res.json())
            .then(data => alert("Exercise Added! Result: " + JSON.stringify(data)))
            .catch(err => console.error(err));
    }

    function viewLogs() {
        const id = document.getElementById('logId').value;
        if(id) window.location.href = `/api/users/${id}/logs`;
    }
</script>
</body>
</html>
